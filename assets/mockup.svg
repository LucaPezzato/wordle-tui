  <g transform="translate(205, 360)">
    <rect x="0" y="0" width="38" height="32" class="kb-key"/>
    <text x="19" y="16" class="kb-text">Q</text>
    <rect x="44" y="0" width="38" height="32" class="kb-key"/>
    <text x="63" y="16" class="kb-text">W</text>
    <rect x="88" y="0" width="38" height="32" class="kb-key"/>
    <text x="107" y="16" class="kb-text">E</text>
    <rect x="132" y="0" width="38" height="32" class="kb-key"/>
    <text x="151" y="16" class="kb-text">R</text>
    <rect x="176" y="0" width="38" height="32" class="tile-present"/>
    <text x="195" y="16" class="text-tile" font-size="12">T</text>
    <rect x="220" y="0" width="38" height="32" class="kb-key"/>
    <text x="239" y="16" class="kb-text">Y</text>
    <rect x="264" y="0" width="38" height="32" class="kb-key"/>
    <text x="283" y="16" class="kb-text">U</text>
    <rect x="308" y="0" width="38" height="32" class="tile-correct"/>
    <text x="327" y="16" class="text-tile" font-size="12">I</text>
