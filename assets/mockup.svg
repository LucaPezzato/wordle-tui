    <rect x="0" y="0" width="38" height="32" class="tile-present"/>
    <text x="19" y="16" class="text-tile" font-size="12">A</text>
    <rect x="44" y="0" width="38" height="32" class="tile-present"/>
    <text x="63" y="16" class="text-tile" font-size="12">S</text>
    <rect x="88" y="0" width="38" height="32" class="kb-key"/>
    <text x="107" y="16" class="kb-text">D</text>
    <rect x="132" y="0" width="38" height="32" class="kb-key"/>
    <text x="151" y="16" class="kb-text">F</text>
    <rect x="176" y="0" width="38" height="32" class="kb-key"/>
    <text x="195" y="16" class="kb-text">G</text>
    <rect x="220" y="0" width="38" height="32" class="kb-key"/>
    <text x="239" y="16" class="kb-text">H</text>
    <rect x="264" y="0" width="38" height="32" class="kb-key"/>
    <text x="283" y="16" class="kb-text">J</text>
    <rect x="308" y="0" width="38" height="32" class="kb-key"/>
    <text x="327" y="16" class="kb-text">K</text>
    <rect x="352" y="0" width="38" height="32" class="kb-key"/>
