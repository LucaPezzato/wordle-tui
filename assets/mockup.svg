    <text x="30" y="16" class="kb-text" fill="#50fa7b">INVIA</text>
    <rect x="66" y="0" width="38" height="32" class="tile-absent"/>
    <text x="85" y="16" class="kb-text" fill="#6272a4">Z</text>
    <rect x="110" y="0" width="38" height="32" class="kb-key"/>
    <text x="129" y="16" class="kb-text">X</text>
    <rect x="154" y="0" width="38" height="32" class="tile-absent"/>
    <text x="173" y="16" class="kb-text" fill="#6272a4">C</text>
    <rect x="198" y="0" width="38" height="32" class="kb-key"/>
    <text x="217" y="16" class="kb-text">V</text>
    <rect x="242" y="0" width="38" height="32" class="kb-key"/>
    <text x="261" y="16" class="kb-text">B</text>
    <rect x="286" y="0" width="38" height="32" class="kb-key"/>
    <text x="305" y="16" class="kb-text">N</text>
    <rect x="330" y="0" width="38" height="32" class="kb-key"/>
    <text x="349" y="16" class="kb-text">M</text>
    <rect x="374" y="0" width="60" height="32" class="kb-key"/>
    <text x="404" y="16" class="kb-text" fill="#ff79c6">⌫</text>
  </g>

  <!-- Footer Bar -->
  <line x1="24" y1="520" x2="826" y2="520" stroke="#44475a" stroke-width="1"/>
  <text x="24" y="542" class="text-muted">[Enter] Invia  [⌫] Cancella  [4-8] Lunghezza  [n] Nuova  [s] Stats  [?] Aiuto  [q] Esci</text>
  <text x="826" y="542" text-anchor="end" class="text-title" font-size="13">Pronto</text>
</svg>
